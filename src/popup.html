<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shade</title>
<style>
:root {font:14px system-ui,sans-serif;color-scheme:dark}
body {width:370px;margin:0;background:#14161c;color:#f4f4fb}
header {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-bottom:1px solid #303440}
h1 {font-size:20px;margin:0;letter-spacing:.2px}.subtle {color:#a5adbd;font-size:12px}
main {padding:14px 18px 18px}button {border:0;background:#526cf3;border-radius:8px;color:#fff;padding:10px 13px;cursor:pointer;font:600 13px system-ui}
button.secondary {background:#343b4b}button.ghost {background:transparent;color:#abb5ca;padding:8px}
button:disabled {opacity:.55;cursor:wait}#list {display:grid;gap:8px} .site {background:#20242e;border:1px solid #363b49;border-radius:10px;padding:12px}
.site-head {display:flex;justify-content:space-between;gap:8px;align-items:center}.site-name {font-weight:600;word-break:break-word}
.site-url {font-size:11px;color:#9ba5b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.site-actions {display:flex;gap:6px;margin-top:10px} .site-actions button:first-child{flex:1}
.master {display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px} .master input {accent-color:#526cf3;cursor:pointer} .site.off {opacity:.76}
.row {display:flex;align-items:center;gap:7px}.dot {width:7px;height:7px;border-radius:50%;background:#697387;flex-shrink:0}.dot.on {background:#53c99d}
label {display:block;font-size:12px;color:#bdc4d2;margin:12px 0 6px}
input[type=url], input[type=text], input[type=password] {box-sizing:border-box;width:100%;background:#242936;color:#fff;border:1px solid #454d61;padding:11px;border-radius:8px;font:14px system-ui}
header label.master {margin:0 0 0 auto;}
label.check {display:flex;align-items:flex-start;gap:9px;line-height:1.3;margin:13px 0 4px;cursor:pointer}
label.check input {margin-top:2px}.hint{font-size:11px;line-height:1.5;color:#9da8ba;margin:6px 0 12px}
#addForm, #passwordPrompt {background:#1d212c;border:1px solid #353c4c;padding:12px;border-radius:10px;margin-top:12px}
.actions {display:flex;gap:8px;margin-top:12px}.actions button {flex:1}#status {white-space:pre-wrap;min-height:1em;color:#aebbd1;font-size:12px;margin-top:12px}
[hidden] {display:none !important}
</style>
</head>
<body>
<header><div class="row"><img src="icons/shade-32.png" alt="" width="28" height="28"><h1>Shade</h1></div><label class="master" title="Отключить все профили и отозвать локальные сеансы"><input id="masterSwitch" type="checkbox" checked><span id="masterState">Включён</span></label><button id="addToggle" class="secondary">+ Сайт</button></header>
<main>
  <p class="hint" id="masterHint" hidden>Все соединения Shade выключены. Обычные сайты продолжают работать.</p>
  <div id="list"></div>
  <p id="empty" class="subtle" hidden>Нет сохранённых сайтов. Добавь адрес и пароль, чтобы подключиться.</p>
  <section id="addForm" hidden>
    <strong>Новое подключение</strong>
    <label for="address">URL сайта</label>
    <input id="address" type="text" spellcheck="false" placeholder="https://example.com" autocomplete="off">
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="off" placeholder="Пароль Shade">
    <p class="hint">Пароль не сохраняется. Повторный вход требуется после истечения сессии.</p>
    <div class="actions"><button id="connect">Подключиться и сохранить</button><button id="cancel" class="secondary">Отмена</button></div>
  </section>
  <section id="passwordPrompt" hidden>
    <strong id="promptName">Вход на сайт</strong>
    <label for="profilePassword">Пароль</label>
    <input id="profilePassword" type="password" placeholder="Пароль Shade" autocomplete="off">
    <div class="actions"><button id="submitProfile">Войти</button><button id="cancelPrompt" class="secondary">Отмена</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="popup.js"></script>
</body></html>
